<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0f1117;--card:#181b24;--text:#e8eaf0;--muted:#8b90a0;--accent:#5865f2;--danger:#e5484d}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:16px}
  .wrap{max-width:800px;margin:0 auto}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{margin:0 0 12px;font-size:18px}
  input,textarea{width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid #2b3040;background:#0f1117;color:var(--text);font:inherit}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}
  button.danger{background:var(--danger)} button.gray{background:#3a4052}
  .row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #232735;flex-wrap:wrap}
  .row small{color:var(--muted)}
  .actions{display:flex;gap:6px}
</style>
</head>
<body>
<div class="wrap">

<div class="card" id="login">
  <h2>Admin login</h2>
  <input type="password" id="pw" placeholder="Password">
  <button onclick="login()">Login</button>
  <p style="color:var(--muted);font-size:13px">First time: whatever you enter becomes your password.</p>
</div>

<div id="panel" hidden>
  <div class="card">
    <h2>Store settings</h2>
    <input id="sName" placeholder="Store name">
    <button onclick="saveSettings()">Save settings</button>
  </div>

  <div class="card">
    <h2 id="formTitle">Add account</h2>
    <input id="title" placeholder="Title (e.g. Aged account 2016)">
    <input id="year" placeholder="Creation year">
    <textarea id="desc" rows="3" placeholder="Description"></textarea>
    <input id="price" type="number" step="0.01" placeholder="Price (MAD)">
    <input id="link" placeholder="Stripe payment link (https://buy.stripe.com/...)">
    <button onclick="saveProduct()">Save</button>
    <button class="gray" onclick="resetForm()">Clear</button>
  </div>

  <div class="card">
    <h2>Accounts</h2>
    <div id="list"></div>
  </div>

  <div class="card">
    <button class="gray" onclick="logout()">Logout</button>
  </div>
</div>
</div>

<script>
function load(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } }
function save(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
async function hash(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let products = load('products', []);
let editing = null;

async function login(){
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  const h = await hash(pw);
  const stored = localStorage.getItem('adminHash');
  if (!stored) localStorage.setItem('adminHash', h);
  else if (stored !== h) return alert('Wrong password');
  sessionStorage.setItem('auth','1');
  show();
}
function logout(){ sessionStorage.removeItem('auth'); location.reload(); }
function show(){
  document.getElementById('login').hidden = true;
  document.getElementById('panel').hidden = false;
  const s = load('settings', { name:'', contact:'' });
  sName.value = s.name || '';
  render();
}
function saveSettings(){ save('settings', { name:sName.value.trim() }); alert('Saved'); }
function saveProduct(){
  if (!title.value.trim() || !price.value) return alert('Title and price are required');
  if (link.value.trim() && !/^https:\/\//i.test(link.value.trim())) return alert('Link must start with https://');
  const item = { id: editing ?? Date.now(), title:title.value.trim(), year:year.value.trim(), description:desc.value.trim(), price:price.value, link:link.value.trim(), sold:false };
  if (editing !== null){
    const old = products.find(p => p.id === editing);
    item.sold = old ? old.sold : false;
    products = products.map(p => p.id === editing ? item : p);
  } else products.push(item);
  save('products', products); resetForm(); render();
}
function resetForm(){ editing = null; title.value = year.value = desc.value = price.value = link.value = ''; formTitle.textContent = 'Add account'; }
function edit(id){
  const p = products.find(x => x.id === id); if (!p) return;
  editing = id; title.value = p.title; year.value = p.year; desc.value = p.description; price.value = p.price; link.value = p.link || '';
  formTitle.textContent = 'Edit account'; scrollTo(0,0);
}
function toggleSold(id){ products = products.map(p => p.id === id ? {...p, sold:!p.sold} : p); save('products', products); render(); }
function del(id){ if (!confirm('Delete?')) return; products = products.filter(p => p.id !== id); save('products', products); render(); }
function render(){
  const l = document.getElementById('list');
  if (!products.length){ l.innerHTML = '<small style="color:#8b90a0">Nothing yet.</small>'; return; }
  l.innerHTML = products.map(p => `<div class="row">
    <div><b>${esc(p.title)}</b> ${p.sold ? '(sold)' : ''}<br><small>${esc(p.year)} · ${esc(p.price)} MAD${p.link ? '' : ' · no link'}</small></div>
    <div class="actions">
      <button class="gray" onclick="edit(${p.id})">Edit</button>
      <button onclick="toggleSold(${p.id})">${p.sold ? 'Unsell' : 'Sold'}</button>
      <button class="danger" onclick="del(${p.id})">Del</button>
    </div></div>`).join('');
}
if (sessionStorage.getItem('auth')) show();
</script>
</body>
</html>
